<!doctype html>
<html lang="en">
<head>

  <style>
    html, body, #map {
      height: 100%;
      margin: 0;
      font-family: Arial, sans-serif;
    }
    .title {
      position: absolute;
      top: 16px;
      left: 56px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid #d0d0d0;
      border-radius: 6px;
      padding: 10px 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
      color: #222;
    }
    .title h1 {
      margin: 0 0 4px;
      font-size: 18px;
    }
    .title div {
      font-size: 12px;
    }
    .legend {
      position: absolute;
      right: 16px;
      bottom: 24px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid #d0d0d0;
      border-radius: 6px;
      padding: 10px 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
      color: #222;
      font-size: 12px;
      line-height: 1.4;
    }
    .dot {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #c75146;
      border: 2px solid #ffffff;
      vertical-align: middle;
      margin-right: 6px;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="title">

  </div>
  <div class="legend">

  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

077, "popup_html": "<strong>Walnut at Observatory</strong><br>Stop ID: 607<br>Bunching events: 370<br>Routes affected: 2"}, {"lat": 43.077349, "lon": -89.428844, "stop_id": "628", "events": 293, "radius": 10.38076923076923, "popup_html": "<strong>Highland at Observatory</strong><br>Stop ID: 628<br>Bunching events: 293<br>Routes affected: 5"}, {"lat": 43.076759, "lon": -89.42577, "stop_id": "615", "events": 287, "radius": 10.311538461538461, "popup_html": "<strong>Observatory at Walnut</strong><br>Stop ID: 615<br>Bunching events: 287<br>Routes affected: 3"}];
    const bounds = [[43.070839, -89.430227], [43.079006, -89.397191]];
    const map = L.map('map').setView([43.075394, -89.413481], 11);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    markers.forEach((marker) => {
      L.circleMarker([marker.lat, marker.lon], {
        radius: marker.radius,
        color: '#ffffff',
        weight: 2,
        fillColor: '#c75146',
        fillOpacity: 0.78
      })
        .bindPopup(marker.popup_html)
        .bindTooltip(`${marker.stop_id}: ${marker.events} events`, {sticky: true})
        .addTo(map);
    });

    if (bounds[0][0] !== bounds[1][0] || bounds[0][1] !== bounds[1][1]) {
      map.fitBounds(bounds, {padding: [30, 30]});
    }
  </script>
</body>
</html>
